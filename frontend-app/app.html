<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Logger - Custom Background Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Thay link bên dưới bằng link ảnh bạn thích, hoặc tên file ảnh của bạn */
            background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-16 selection:bg-indigo-500 selection:text-white">

<!-- Lớp phủ mờ (Overlay) giúp giao diện nổi bật hơn trên nền ảnh -->
<div class="min-h-screen bg-slate-900/40 backdrop-blur-[2px]">

    <!-- Top Navigation Bar -->
    <header class="bg-white/90 backdrop-blur-md border-b-2 border-emerald-400 sticky top-0 z-20 shadow-lg">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-emerald-500/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900">Work Logger</h1>
                    <p class="text-xs text-slate-600 font-semibold uppercase tracking-wider">Task & Time Management</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                    <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-800 border-2 border-emerald-300 shadow-inner">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                        Live System
                    </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-10 space-y-10">

        <!-- Form Section -->
        <section class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/40 p-8 md:p-10 transition-all duration-300">
            <div class="flex items-center justify-between mb-8 pb-5 border-b-2 border-indigo-100">
                <div class="flex items-center gap-4">
                    <div class="p-3.5 bg-indigo-100 text-indigo-700 rounded-2xl border-2 border-indigo-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-950">Schedule New Task</h2>
                        <p class="text-xs text-slate-600 font-medium">Create a new entry in your timeline</p>
                    </div>
                </div>
            </div>

            <form id="scheduleForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Task Title -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold uppercase tracking-widest text-indigo-950/80 mb-2.5">Task Title</label>
                        <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-indigo-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </span>
                            <input type="text" id="title" required placeholder="e.g., Q3 Marketing Roadmap Review"
                                   class="w-full pl-12 pr-5 py-3.5 text-base bg-indigo-50/50 border-2 border-indigo-100 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition duration-200 text-slate-950 placeholder:text-slate-500/80">
                        </div>
                    </div>

                    <!-- Start Date & Time -->
                    <div>
                        <label class="block text-sm font-semibold uppercase tracking-widest text-indigo-950/80 mb-2.5">Start Date & Time</label>
                        <input type="datetime-local" id="start_date" required
                               class="w-full px-5 py-3.5 text-base bg-indigo-50/50 border-2 border-indigo-100 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition duration-200 text-slate-950">
                    </div>

                    <!-- End Date & Time -->
                    <div>
                        <label class="block text-sm font-semibold uppercase tracking-widest text-indigo-950/80 mb-2.5">End Date & Time</label>
                        <input type="datetime-local" id="end_date"
                               class="w-full px-5 py-3.5 text-base bg-indigo-50/50 border-2 border-indigo-100 rounded-2xl focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition duration-200 text-slate-950">
                    </div>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" id="btnSubmit"
                            class="px-8 py-3.5 bg-gradient-to-r from-indigo-700 to-indigo-600 hover:from-indigo-800 hover:to-indigo-700 text-white text-base font-extrabold rounded-2xl shadow-xl shadow-indigo-500/30 hover:shadow-indigo-500/40 active:scale-[0.97] transition-all duration-200 flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        <span>Save Schedule</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- List Section -->
        <section class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/40 p-8 md:p-10">
            <div class="flex items-center justify-between mb-8 pb-5 border-b-2 border-violet-100">
                <div class="flex items-center gap-4">
                    <div class="p-3.5 bg-violet-100 text-violet-700 rounded-2xl border-2 border-violet-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-950">Scheduled Tasks</h2>
                        <p class="text-xs text-slate-600 font-medium">Active and upcoming entries</p>
                    </div>
                </div>
            </div>

            <div id="scheduleList" class="space-y-4">
                <div class="text-center py-16 text-slate-500 text-base font-medium flex flex-col items-center justify-center gap-4">
                    <div class="w-10 h-10 rounded-full border-4 border-violet-600 border-t-transparent animate-spin"></div>
                    Loading schedules...
                </div>
            </div>
        </section>

    </main>
</div>
<button id="logoutButton">Logout</button>

<!-- Embedded JS -->
<script>
    const logoutButton = document.getElementById('logoutButton');

    if (logoutButton) {
        logoutButton.addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });
    }

    const token = sessionStorage.getItem('token');

    if (!token) {
        window.location.href = 'login.html';
    } else {
        checkAuth();
    }

    async function checkAuth() {
        try {
            const response = await fetch(
                'http://localhost:3000/api/auth/me',
                {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                }
            );

            if (!response.ok) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }

        } catch (error) {
            console.error('Auth check error:', error);
        }
    }
    const API_BASE_URL = 'http://localhost:3000/api';

    document.addEventListener('DOMContentLoaded', () => {
        const scheduleForm = document.getElementById('scheduleForm');
        loadScheduledItems();

        if (scheduleForm) {
            scheduleForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('title').value;
                const startDateTime = document.getElementById('start_date').value;
                const endDateTime = document.getElementById('end_date').value;

                const start_date = startDateTime.split('T')[0];
                const end_date = endDateTime.split('T')[0];

                const currentUser = JSON.parse(
                    sessionStorage.getItem('user')
                );

                const newItem = {
                    title: title,
                    item_type: 'Task',
                    start_date: start_date,
                    end_date: end_date
                };

                try {
                    const token = sessionStorage.getItem('token');

                    const response = await fetch(`${API_BASE_URL}/scheduled-items`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(newItem)
                    });

                    if (response.ok) {
                        scheduleForm.reset();
                        loadScheduledItems();
                    } else {
                        alert('Failed to save schedule.');
                    }
                } catch (error) {
                    console.error('Error adding item:', error);
                    alert('Error connecting to backend server.');
                }
            });
        }
    });

    async function loadScheduledItems() {
        const scheduleList = document.getElementById('scheduleList');
        if (!scheduleList) return;

        try {
            const response = await fetch(`${API_BASE_URL}/scheduled-items`);
            if (!response.ok) throw new Error('Failed to fetch data.');

            const items = await response.json();
            renderScheduleList(items);
        } catch (error) {
            console.error('API Error:', error);
            scheduleList.innerHTML = `
                    <div class="p-5 bg-red-100 border-2 border-red-300 text-red-900 rounded-2xl text-base text-center font-semibold shadow-inner">
                        Unable to load schedules. Please make sure the backend server is running on port 3000.
                    </div>
                `;
        }
    }

    function renderScheduleList(items) {
        const scheduleList = document.getElementById('scheduleList');
        if (!scheduleList) return;

        if (!items || items.length === 0) {
            scheduleList.innerHTML = `
                    <div class="text-center py-16 text-slate-500 text-base italic border-4 border-dashed border-slate-200 rounded-3xl bg-slate-100/50">
                        No items found in your schedule.
                    </div>
                `;
            return;
        }

        scheduleList.innerHTML = items.map(item => {
            const start = item.start_date ? new Date(item.start_date).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : 'N/A';
            const end = item.end_date ? new Date(item.end_date).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : 'N/A';

            return `
                    <div class="p-6 bg-white border-2 border-slate-100 hover:border-violet-300 hover:shadow-2xl hover:shadow-violet-500/10 rounded-3xl transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-5 group">
                        <div class="space-y-2">
                            <h3 class="font-extrabold text-slate-950 text-base flex items-center gap-3">
                                <span class="w-3 h-3 rounded-full bg-violet-600 shadow-lg shadow-violet-500"></span>
                                ${escapeHtml(item.title || 'Untitled Task')}
                            </h3>
                            <div class="text-sm text-slate-700 flex flex-wrap items-center gap-x-8 gap-y-1.5 pl-6 font-medium">
                                <span class="flex items-center gap-2 text-indigo-900/80"><strong class="font-bold text-indigo-950 uppercase tracking-wide text-xs">Start</strong> ${start}</span>
                                <span class="flex items-center gap-2 text-violet-900/80"><strong class="font-bold text-violet-950 uppercase tracking-wide text-xs">End</strong> ${end}</span>
                            </div>
                        </div>
                        <div class="flex-shrink-0">
                            <span class="inline-flex items-center gap-2 px-4 py-2 text-sm font-bold bg-violet-100 text-violet-800 rounded-full border-2 border-violet-200 group-hover:bg-violet-600 group-hover:text-white transition-colors duration-200">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Active
                            </span>
                        </div>
                    </div>
                `;
        }).join('');
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }
</script>
</body>
</html>
